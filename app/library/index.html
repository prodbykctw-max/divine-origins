<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- GitHub Pages ignores _headers, so the security policy ships as meta tags.
       'unsafe-inline' scripts: the build inlines the bundle and sections use onclick="" handlers.
       prodbykctw-max.github.io: the single-file build loads photos and icons from the live site. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://prodbykctw-max.github.io; manifest-src 'self' https://prodbykctw-max.github.io; media-src 'self'; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Divine Origins: a comparative theology library</title>
  <meta name="description" content="Compare creator gods, sacred texts and calendars across the world's religious traditions, with real photos of the manuscripts and a 3D map of 643 deities.">
  <link rel="canonical" href="https://prodbykctw-max.github.io/divine-origins/">
  <meta name="theme-color" content="#262321">
  <meta name="color-scheme" content="dark light">
  <meta name="author" content="KCTW">

  <!-- Icons -->
  <link rel="icon" href="icons/favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="icons/site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Divine Origins">

  <!-- Sharing previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Divine Origins">
  <meta property="og:title" content="Divine Origins">
  <meta property="og:description" content="Compare creator gods, sacred texts and calendars across the world's religious traditions, with real photos of the manuscripts and a 3D map of 643 deities.">
  <meta property="og:url" content="https://prodbykctw-max.github.io/divine-origins/">
  <meta property="og:image" content="https://prodbykctw-max.github.io/divine-origins/icons/og-image-v3.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Divine Origins, with photos of the Book of the Dead, the Gilgamesh flood tablet, the Garima Gospels, the Diamond Sutra, a Maya vase and the Code of Hammurabi">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Divine Origins">
  <meta name="twitter:description" content="Compare creator gods, sacred texts and calendars across the world's religious traditions, with real photos of the manuscripts and a 3D map of 643 deities.">
  <meta name="twitter:image" content="https://prodbykctw-max.github.io/divine-origins/icons/og-image-v3.jpg">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Divine Origins","url":"https://prodbykctw-max.github.io/divine-origins/","description":"Compare creator gods, sacred texts and calendars across the world's religious traditions, with real photos of the manuscripts and a 3D map of 643 deities.","inLanguage":"en","creator":{"@type":"Person","name":"KCTW"}}</script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Stylesheets — order matters -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- WebGL universe (React Three Fiber) — sits behind everything -->
  <div id="universe" aria-hidden="true"></div>

  <div class="page">

    <!-- ── TOP NAVIGATION ── -->
    <nav class="topnav" role="navigation" aria-label="Main navigation">
      <div class="topnav__inner">
        <span class="topnav__logo" aria-label="Divine Origins">Divine Origins</span>
        <a href="#home"       class="topnav__link" data-section="home"       aria-current="page">Home</a>
        <a href="#traditions" class="topnav__link" data-section="traditions">Traditions</a>
        <a href="#deities"    class="topnav__link" data-section="deities">Deities</a>
        <a href="#texts"      class="topnav__link topnav__link--cta" data-section="texts">Sacred texts</a>
        <a href="#calendars"  class="topnav__link" data-section="calendars">Calendars</a>
        <a href="#patterns"   class="topnav__link" data-section="patterns">The pattern</a>
        <a href="#timeline"   class="topnav__link" data-section="timeline">Timeline</a>
        <a href="#source-map" class="topnav__link topnav__link--cta" data-section="source-map">Source map</a>
      </div>
    </nav>

    <!-- ── SECTIONS — each section is its own island ── -->
    <!-- Section markup is injected by render.js -->
    <!-- Hidden by default; router shows the active one -->

    <main>
      <section id="section-home"       role="region" aria-label="Home">
        <!-- Injected by render.js renderHome() -->
      </section>

      <section id="section-traditions" role="region" aria-label="Traditions" hidden aria-hidden="true">
        <!-- Injected by render.js renderTraditions() -->
      </section>

      <section id="section-deities"    role="region" aria-label="Deities" hidden aria-hidden="true">
        <!-- Injected by render.js renderDeities() -->
      </section>

      <section id="section-texts"      role="region" aria-label="Sacred Texts" hidden aria-hidden="true">
        <!-- Injected by render.js renderTexts() -->
      </section>

      <section id="section-calendars"  role="region" aria-label="Calendar Systems" hidden aria-hidden="true">
        <!-- Injected by render.js renderCalendars() -->
      </section>

      <section id="section-patterns"   role="region" aria-label="The Pattern" hidden aria-hidden="true">
        <!-- Injected by render.js renderPatterns() -->
      </section>

      <section id="section-timeline"   role="region" aria-label="Timeline" hidden aria-hidden="true">
        <!-- Injected by render.js renderTimeline() -->
      </section>

      <section id="section-source-map" role="region" aria-label="The Source Map" hidden aria-hidden="true">
        <!-- Injected by render.js renderSourceMap() -->
      </section>
    </main>

  </div><!-- /.page -->

  <!-- ── MODAL ── -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-label="Detail view" aria-hidden="true">
    <div class="modal" id="modal">
      <button class="modal__close" id="modal-close" aria-label="Close">Close</button>
      <div class="modal__accent" id="modal-accent"></div>
      <div class="modal__content" id="modal-content"></div>
    </div>
  </div>

  <!-- ── SCRIPTS ── ES modules, Cloudflare-ready ── -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
