name: Deploy site

# Builds the site from main and publishes it to GitHub Pages:
# https://prodbykctw-max.github.io/divine-origins/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/vite/package-lock.json
      - name: Build site (index.html + img/)
        run: node app/build_combined.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/site
      - id: deployment
        uses: actions/deploy-pages@v4
